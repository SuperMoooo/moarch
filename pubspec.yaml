name: moarch
description: Flutter CLI — scaffold Clean Architecture projects with Riverpod or flutter_bloc, FVM and your own conventions.
version: 7.3.0
repository: https://github.com/SuperMoooo/moarch
homepage: https://supermoooo.github.io/Portfolio/
issue_tracker: https://github.com/SuperMoooo/moarch/issues

topics:
    - cli
    - scaffolding
    - clean-architecture
    - riverpod
    - bloc

environment:
    sdk: '>=3.4.0 <4.0.0'

dependencies:
    args: ^2.4.2
    mason_logger: ^0.3.2
    path: ^1.9.0
    yaml: ^3.1.3
    yaml_edit: ^2.2.4

dev_dependencies:
    lints: ^4.0.0
    test: ^1.24.0

executables:
    moarch: main
