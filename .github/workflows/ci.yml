name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      # version.dart duplicates the pubspec version because the pubspec can't
      # be read at runtime once the package is globally activated — this is
      # what keeps the two from drifting apart.
      - name: Verify version.dart matches pubspec.yaml
        run: |
          PUBSPEC=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          CODE=$(grep -oE "'[^']+'" lib/src/version.dart | tr -d "'")
          if [ "$PUBSPEC" != "$CODE" ]; then
            echo "Version mismatch: pubspec.yaml has $PUBSPEC, lib/src/version.dart has $CODE"
            exit 1
          fi

      - name: Run tests
        run: dart test

      - name: Verify pub score
        run: dart pub publish --dry-run
